<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GHOST DASH — a tiny browser game built from one prompt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #0b1026; height: 100%; overflow: hidden; }
  canvas { display: block; margin: 0 auto; background: #0b1026; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 10px; text-align: center;
    color: #8ea0c9; font: 14px/1.4 "DejaVu Sans", sans-serif; letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="hint">ARROW KEYS / A D TO MOVE &nbsp;•&nbsp; DODGE THE METEORS &nbsp;•&nbsp; GRAB THE COINS</div>
<script>
"use strict";
// GHOST DASH — a tiny browser game.
// One prompt built it: "a little ghost dodging falling meteors and collecting coins.
// Make it fun, make it pretty."
// Move with ArrowLeft / ArrowRight (or A / D), or drag with mouse / touch.
// ?demo=1 turns on the autopilot so the ghost plays itself (used for the video).

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const FLOOR = H - 96;

// Deterministic RNG so every demo run plays the same game.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
const DEMO = params.get("demo") === "1";
const rng = mulberry32(1337);

// Stars for the night sky.
const stars = [];
for (let i = 0; i < 110; i++) {
  stars.push({ x: rng() * W, y: rng() * H * 0.7, r: 0.6 + rng() * 1.7, tw: rng() * Math.PI * 2 });
}

const ghost = { x: W / 2, y: FLOOR - 46, w: 64, h: 76, vx: 0, speed: 560, bob: 0 };
const meteors = [];
const coins = [];
const parts = [];
let score = 0, coinCount = 0, lives = 3;
let spawnT = 0, coinT = 0, elapsed = 0, shake = 0, over = false, flash = 0;
let keys = {};

function spawnMeteor() {
  const r = 15 + rng() * 20;
  meteors.push({
    x: 40 + rng() * (W - 80), y: -40,
    r: r, vy: 200 + rng() * 180 + elapsed * 2.4,
    vx: (rng() - 0.5) * 70, rot: rng() * Math.PI * 2, vr: (rng() - 0.5) * 2.4,
    hue: 14 + rng() * 22
  });
}
function spawnCoin() {
  coins.push({ x: 50 + rng() * (W - 100), y: -30, r: 16, vy: 170 + rng() * 60, spin: 0 });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    parts.push({ x: x, y: y, vx: (rng() - 0.5) * 420, vy: (rng() - 0.5) * 420 - 60,
      life: 0.5 + rng() * 0.5, max: 1, color: color, r: 2 + rng() * 4 });
  }
}
function circleHit(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy < (ar + br) * (ar + br);
}

// Autopilot: steer away from the nearest threatening meteor, drift to the nearest coin.
function autopilot(dt) {
  let threat = null, threatD = 1e9;
  for (const m of meteors) {
    const dy = ghost.y - m.y;
    if (dy > 0 && dy < 340 && Math.abs(m.x - ghost.x) < 150) {
      const d = dy + Math.abs(m.x - ghost.x);
      if (d < threatD) { threatD = d; threat = m; }
    }
  }
  let target = ghost.x;
  if (threat) {
    target = ghost.x + (threat.x >= ghost.x ? -220 : 220);
  } else {
    let best = null, bestD = 1e9;
    for (const c of coins) {
      const d = Math.abs(c.x - ghost.x) + (ghost.y - c.y) * 0.4;
      if (d < bestD) { bestD = d; best = c; }
    }
    if (best) target = best.x;
  }
  target = Math.max(44, Math.min(W - 44, target));
  const diff = target - ghost.x;
  ghost.vx = Math.max(-ghost.speed, Math.min(ghost.speed, diff * 6));
}

function drawGhost(x, y, t) {
  const bob = Math.sin(t * 3.2) * 4;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.shadowColor = "rgba(160, 200, 255, 0.9)";
  ctx.shadowBlur = 26;
  const grad = ctx.createLinearGradient(0, -40, 0, 40);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(1, "#c9d6ff");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-30, 34);
  ctx.lineTo(-30, -8);
  ctx.arc(0, -8, 30, Math.PI, 0);
  ctx.lineTo(30, 34);
  for (let i = 0; i < 4; i++) {
    const cx = 30 - i * 15;
    ctx.quadraticCurveTo(cx - 7.5, 44, cx - 15, 34);
  }
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#101736";
  ctx.beginPath(); ctx.ellipse(-11, -12, 5.5, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -12, 5.5, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(-9.5, -14.5, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(12.5, -14.5, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#101736"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, 4, 8, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}

function drawMeteor(m) {
  // Fading trail streak above the meteor, in screen space (it falls down).
  const trail = ctx.createLinearGradient(0, m.y - m.r, 0, m.y - m.r - 46);
  trail.addColorStop(0, "rgba(255, 170, 80, 0.55)");
  trail.addColorStop(1, "rgba(255, 170, 80, 0)");
  ctx.strokeStyle = trail;
  ctx.lineWidth = Math.max(4, m.r * 0.35);
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(m.x, m.y - m.r); ctx.lineTo(m.x, m.y - m.r - 46); ctx.stroke();
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  const g = ctx.createRadialGradient(-m.r * 0.3, -m.r * 0.3, m.r * 0.1, 0, 0, m.r * 1.15);
  g.addColorStop(0, "#ffd9a0");
  g.addColorStop(0.45, "#ff8a3d");
  g.addColorStop(1, "#c33d12");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, m.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(120, 30, 0, 0.45)";
  ctx.beginPath(); ctx.arc(-m.r * 0.35, -m.r * 0.2, m.r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(m.r * 0.3, m.r * 0.3, m.r * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(Math.abs(Math.cos(c.spin)) * 0.7 + 0.3, 1);
  ctx.shadowColor = "rgba(255, 210, 80, 0.9)";
  ctx.shadowBlur = 16;
  const g = ctx.createRadialGradient(-5, -6, 2, 0, 0, c.r);
  g.addColorStop(0, "#fff3b0");
  g.addColorStop(0.55, "#ffd23e");
  g.addColorStop(1, "#e09b00");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#8a5c00";
  ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("M", 0, 1);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = "rgba(10, 14, 38, 0.55)";
  ctx.fillRect(0, 0, W, 64);
  ctx.textBaseline = "middle";
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? "#ff4d6d" : "rgba(255,255,255,0.18)";
    const hx = 28 + i * 34, hy = 32;
    ctx.beginPath();
    ctx.moveTo(hx, hy + 8);
    ctx.bezierCurveTo(hx - 11, hy - 3, hx - 5, hy - 12, hx, hy - 5);
    ctx.bezierCurveTo(hx + 5, hy - 12, hx + 11, hy - 3, hx, hy + 8);
    ctx.fill();
  }
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 30px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("SCORE  " + String(Math.floor(score)).padStart(5, "0"), W / 2, 33);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd23e";
  ctx.fillText("◉ " + coinCount, W - 28, 33);
  ctx.textAlign = "left";
  ctx.fillStyle = "#8ea0c9";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("GHOST DASH", 28, 52);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((rng() - 0.5) * shake, (rng() - 0.5) * shake);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0b1026");
  sky.addColorStop(0.6, "#1a1440");
  sky.addColorStop(1, "#3a1c5c");
  ctx.fillStyle = sky;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  const t = elapsed;
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.4 + s.tw));
    ctx.fillStyle = "#dfe8ff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#f5f0e1";
  ctx.beginPath(); ctx.arc(W - 130, 92, 42, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(11, 16, 38, 0.25)";
  ctx.beginPath(); ctx.arc(W - 144, 80, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - 116, 104, 12, 0, Math.PI * 2); ctx.fill();
  const ground = ctx.createLinearGradient(0, FLOOR, 0, H);
  ground.addColorStop(0, "#241b4d");
  ground.addColorStop(1, "#120e2a");
  ctx.fillStyle = ground;
  ctx.fillRect(-20, FLOOR, W + 40, H - FLOOR + 20);
  ctx.fillStyle = "rgba(255, 210, 62, 0.25)";
  ctx.fillRect(-20, FLOOR, W + 40, 3);
  for (const c of coins) drawCoin(c);
  for (const m of meteors) drawMeteor(m);
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (!over) drawGhost(ghost.x, ghost.y, t);
  drawHUD();
  if (over) {
    ctx.fillStyle = "rgba(8, 10, 30, 0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 72px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 40);
    ctx.fillStyle = "#ffd23e";
    ctx.font = "bold 40px sans-serif";
    ctx.fillText("SCORE  " + Math.floor(score) + "   •   COINS  " + coinCount, W / 2, H / 2 + 30);
    ctx.fillStyle = "#8ea0c9";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("PRESS R TO PLAY AGAIN", W / 2, H / 2 + 90);
  }
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = "rgba(255, 80, 80, " + (flash * 0.35).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!over) {
    elapsed += dt;
    score += dt * 12;
    if (DEMO) autopilot(dt);
    else {
      let dir = 0;
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dir -= 1;
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) dir += 1;
      ghost.vx = dir * ghost.speed;
    }
    ghost.x = Math.max(44, Math.min(W - 44, ghost.x + ghost.vx * dt));
    spawnT -= dt; coinT -= dt;
    if (spawnT <= 0) { spawnMeteor(); spawnT = Math.max(0.34, 0.95 - elapsed * 0.009); }
    if (coinT <= 0) { spawnCoin(); coinT = 1.4 + rng() * 1.6; }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.y += m.vy * dt; m.x += m.vx * dt; m.rot += m.vr * dt;
      if (m.y - m.r > H + 20) { meteors.splice(i, 1); continue; }
      if (circleHit(ghost.x, ghost.y - 6, 26, m.x, m.y, m.r * 0.82)) {
        burst(m.x, m.y, "#ff8a3d", 26);
        meteors.splice(i, 1);
        lives -= 1; shake = 22; flash = 1;
        if (lives <= 0) { over = true; burst(ghost.x, ghost.y, "#ffffff", 60); }
      }
    }
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.y += c.vy * dt; c.spin += dt * 5;
      if (c.y - c.r > H + 20) { coins.splice(i, 1); continue; }
      if (circleHit(ghost.x, ghost.y - 6, 30, c.x, c.y, c.r + 4)) {
        burst(c.x, c.y, "#ffd23e", 16);
        coins.splice(i, 1);
        coinCount += 1; score += 100;
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 2.2);
  }
  draw();
  requestAnimationFrame(step);
}

addEventListener("keydown", (e) => {
  keys[e.key] = true;
  if ((e.key === "r" || e.key === "R") && over) location.reload();
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
});
addEventListener("keyup", (e) => { keys[e.key] = false; });
let dragX = null;
canvas.addEventListener("pointerdown", (e) => { dragX = e.clientX; });
addEventListener("pointermove", (e) => {
  if (dragX !== null) {
    const rect = canvas.getBoundingClientRect();
    ghost.x = Math.max(44, Math.min(W - 44, (e.clientX - rect.left) * (W / rect.width)));
  }
});
addEventListener("pointerup", () => { dragX = null; });

window.__game = { get score() { return Math.floor(score); }, get lives() { return lives; },
  get coins() { return coinCount; }, get over() { return over; }, get elapsed() { return elapsed; } };
requestAnimationFrame(step);
</script>
</body>
</html>
